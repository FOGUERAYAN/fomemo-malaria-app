name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # TensorFlow n'est pas nécessaire aux tests (logique isolée dans utils/)
      - run: pip install pytest numpy pillow
      - run: pytest -q
